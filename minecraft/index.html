<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172018">
<title>Groupcat Minecraft</title>
<style>
:root{color-scheme:dark;--cream:#f0eadb;--muted:#b8b9a8;--green:#83a65a;--deep:#172018}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--cream)}
body{min-height:100vh;background:linear-gradient(180deg,rgba(11,18,13,.35),rgba(11,18,13,.86)),url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2200&q=85") center/cover fixed;display:flex;flex-direction:column}
header{height:76px;display:flex;align-items:center;padding:0 clamp(22px,6vw,88px);border-bottom:1px solid #ffffff20;background:#10171070;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center}
.brand-logo{display:block;width:142px;height:auto;max-height:48px;object-fit:contain;filter:drop-shadow(0 2px 5px #0008)}
.hero-logo{display:block;width:min(680px,88vw);height:auto;margin:0 auto;filter:drop-shadow(0 8px 24px #0009)}
main{flex:1;display:grid;place-items:center;text-align:center;padding:70px 22px 90px}
.hero{max-width:760px}
h1{font-size:clamp(46px,8vw,86px);line-height:.98;letter-spacing:-.065em;margin:0;font-weight:900;text-shadow:0 5px 25px #0008}
h1 span{color:#a9c77a}
.play{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-width:210px;padding:17px 34px;background:#84a95a;color:#111a10;text-decoration:none;font-weight:900;letter-spacing:.12em;font-size:15px;border:1px solid #c3df98;box-shadow:0 5px 0 #4b6534,0 12px 30px #0005;transition:transform .15s,filter .15s;margin-top:36px}
.play:hover{transform:translateY(-2px);filter:brightness(1.08)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #4b6534}
.arrow{font-size:19px}
footer{padding:18px 24px;text-align:center;color:#d0d2c2a8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:600px){body{background-position:center}header{height:64px}main{padding-top:50px;padding-bottom:65px}}
</style>
</head>
<body>
<header><div class="brand"><img class="brand-logo" src="https://www.citypng.com/public/uploads/preview/hd-minecraft-logo-transparent-background-701751694772068q54lqpdt1o.png" alt="Minecraft"></div></header>
<main><section class="hero">
<img class="hero-logo" src="https://www.citypng.com/public/uploads/preview/hd-minecraft-logo-transparent-background-701751694772068q54lqpdt1o.png" alt="Minecraft">
<a class="play" href="/play/"><span>PLAY</span><span class="arrow">→</span></a>
</section></main>
<footer>GROUPCAT · BROWSER EDITION</footer>
<!-- Groupcat Minecraft standalone site -->
</body></html>
