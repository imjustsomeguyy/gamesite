<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GunSpin — Groupcat</title>
<base href="https://cdn.jsdelivr.net/gh/55gms/55gms@master/static/misc/gunspin/">
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">
<script src="TemplateData/UnityProgress.js"></script>
<script src="Build/UnityLoader.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.webgl-content,#unityContainer{width:100%!important;height:100%!important}
#unityContainer{position:absolute!important;inset:0!important;margin:0!important;transform:none!important}
.footer{display:none!important}
</style>
<script>
window.addEventListener("load",()=>{try{window.gameInstance=UnityLoader.instantiate("unityContainer","Build/GunSpin WebGL FinalVersion.json")}catch(e){document.body.innerHTML='<p style="color:white;font:16px system-ui;padding:24px">GunSpin could not start. Refresh the page and try again.</p>'}});
</script>
</head>
<body><div class="webgl-content"><div id="unityContainer"></div><div class="footer"><div class="webgl-logo"></div><div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div><div class="title">GunSpin</div></div></div></body>
</html>
